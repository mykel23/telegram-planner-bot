# Cloudflare Worker configuration for the planner bot.
# Nothing in this file is secret. Secrets (bot token, API key, webhook secret)
# are stored in Cloudflare: Workers & Pages > telegram-planner-bot > Settings > Variables and Secrets.

name = "telegram-planner-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Runs every hour on the hour (UTC). The code converts to your time zone and
# decides whether it is time for the daily message or the weekly check-in,
# so daylight saving changes are handled automatically.
[triggers]
crons = ["0 * * * *"]

[vars]
TIMEZONE = "America/Chicago"
DAILY_HOUR = "7"        # 7:00 AM
WEEKLY_DAY = "Sunday"
WEEKLY_HOUR = "18"      # 6:00 PM
CLAUDE_MODEL = "claude-haiku-5-5"

[[d1_databases]]
binding = "DB"
database_name = "planner-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[observability]
enabled = true
